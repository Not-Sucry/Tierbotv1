<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fakepixel tier test Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        .rank-s { @apply bg-yellow-400 text-black; }
        .rank-a { @apply bg-orange-500 text-white; }
        .rank-b { @apply bg-blue-500 text-white; }
        .rank-c { @apply bg-gray-500 text-white; }
        
        .tier-badge {
            @apply px-2 py-1 rounded text-xs font-bold text-center;
        }

        .position-badge {
            @apply w-12 h-12 rounded-full flex items-center justify-center font-bold text-lg;
        }

        .position-1 { @apply bg-gradient-to-br from-yellow-400 to-yellow-600 text-black; }
        .position-2 { @apply bg-gradient-to-br from-gray-300 to-gray-500 text-black; }
        .position-3 { @apply bg-gradient-to-br from-orange-400 to-orange-600 text-black; }
        .default-pos { @apply bg-purple-700 text-white; }

        .gamemode-tab {
            @apply px-4 py-2 rounded-t-lg cursor-pointer text-sm font-semibold transition;
        }

        .gamemode-tab.active {
            @apply bg-purple-600 text-white border-b-2 border-purple-400;
        }

        .gamemode-tab.inactive {
            @apply bg-gray-700 text-gray-300 hover:bg-gray-600;
        }

        .player-card {
            @apply bg-gray-800 rounded-lg p-4 mb-3 border border-purple-500 hover:border-purple-400 transition;
        }

        .rank-pill {
            @apply inline-block px-2 py-1 rounded text-xs font-bold mr-2;
        }

        .tier-icons {
            @apply flex flex-wrap gap-1;
        }

        .tier-icon {
            @apply w-8 h-8 rounded flex items-center justify-center text-xs font-bold;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div id="app"></div>

    <script>
        // ════════════════════════════════════════════════════════════════════
        // 📱 STATE & UTILS
        // ════════════════════════════════════════════════════════════════════

        let user = null;
        let leaderboard = [];
        let selectedPlayer = null;
        let selectedGamemode = 'all';
        let socket = null;

        const RANKS = ['S', 'A', 'B', 'C'];
        const GAMEMODES = ['bedfight', 'sumo', 'the_classic', 'the_bridge'];
        const GAMEMODE_NAMES = {
            'bedfight': 'Bedfight',
            'sumo': 'Sumo',
            'the_classic': 'The Classic',
            'the_bridge': 'The Bridge'
        };

        const GAMEMODE_EMOJIS = {
            'bedfight': '🛏️',
            'sumo': '🥋',
            'the_classic': '⚔️',
            'the_bridge': '🌉'
        };

        const RANK_COLORS = {
            'S': 'rank-s',
            'A': 'rank-a',
            'B': 'rank-b',
            'C': 'rank-c'
        };

        function getPositionBadgeClass(position) {
            if (position === 1) return 'position-1';
            if (position === 2) return 'position-2';
            if (position === 3) return 'position-3';
            return 'default-pos';
        }

        function getPositionMedal(position) {
            if (position === 1) return '🥇';
            if (position === 2) return '🥈';
            if (position === 3) return '🥉';
            return '';
        }

        // ════════════════════════════════════════════════════════════════════
        // 🔌 SOCKET.IO SETUP
        // ════════════════════════════════════════════════════════════════════

        function initSocket() {
            socket = io();
            
            socket.on('leaderboardUpdate', (data) => {
                leaderboard = data;
                render();
            });

            socket.on('rankUpdated', (data) => {
                console.log('✅ Rank updated:', data);
                fetchLeaderboard();
            });

            socket.on('rankRemoved', (data) => {
                console.log('✅ Rank removed:', data);
                fetchLeaderboard();
            });
        }

        // ════════════════════════════════════════════════════════════════════
        // 🔐 AUTH
        // ════════════════════════════════════════════════════════════════════

        async function checkAuth() {
            try {
                const res = await fetch('/api/user');
                if (res.ok) {
                    user = await res.json();
                    initSocket();
                    fetchLeaderboard();
                    render();
                } else {
                    showLoginPage();
                }
            } catch (err) {
                console.error('Auth check failed:', err);
                showLoginPage();
            }
        }

        function logout() {
            window.location.href = '/auth/logout';
        }

        // ════════════════════════════════════════════════════════════════════
        // 📊 DATA FETCHING
        // ════════════════════════════════════════════════════════════════════

        async function fetchLeaderboard() {
            try {
                const res = await fetch('/api/leaderboard');
                if (res.ok) {
                    leaderboard = await res.json();
                    render();
                }
            } catch (err) {
                console.error('Failed to fetch leaderboard:', err);
            }
        }

        async function updateRank(userId, gamemode, rank) {
            try {
                const res = await fetch('/api/rank/set', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, gamemode, rank })
                });

                if (res.ok) {
                    alert('✅ Rank updated!');
                    fetchLeaderboard();
                } else {
                    alert('❌ Failed to update rank');
                }
            } catch (err) {
                console.error('Update failed:', err);
                alert('Error updating rank');
            }
        }

        async function removeRank(userId, gamemode) {
            if (!confirm(`Remove ${GAMEMODE_NAMES[gamemode]} tier from <@${userId}>?`)) return;

            try {
                const res = await fetch('/api/rank/remove', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, gamemode })
                });

                if (res.ok) {
                    alert('✅ Rank removed!');
                    fetchLeaderboard();
                } else {
                    alert('❌ Failed to remove rank');
                }
            } catch (err) {
                console.error('Removal failed:', err);
                alert('Error removing rank');
            }
        }

        // ════════════════════════════════════════════════════════════════════
        // 🎨 RENDER FUNCTIONS
        // ════════════════════════════════════════════════════════════════════

        function showLoginPage() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-purple-900 via-gray-900 to-black flex items-center justify-center">
                    <div class="text-center">
                        <h1 class="text-5xl font-bold mb-4">💎 fakepixel tier test Dashboard</h1>
                        <p class="text-gray-400 mb-8">Staff Portal with Real-time Rank Management</p>
                        <a href="/auth/login" class="bg-blue-600 hover:bg-blue-700 px-8 py-3 rounded-lg font-semibold inline-block">
                            🔐 Login with Discord
                        </a>
                    </div>
                </div>
            `;
        }

        function render() {
            if (!user) return showLoginPage();

            // Filter leaderboard by selected gamemode
            let filteredLeaderboard = leaderboard;
            if (selectedGamemode !== 'all') {
                // For specific gamemode, restructure to show primary tier
                filteredLeaderboard = leaderboard.slice(0, 10); // Still show top 10
            }

            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gray-900">
                    <!-- Header -->
                    <nav class="bg-gray-800 border-b border-purple-600 sticky top-0 z-50">
                        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <span class="text-3xl">💎</span>
                                <h1 class="text-2xl font-bold">fakepixel tier test</h1>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="text-sm">
                                    <p class="text-gray-400">Logged in as</p>
                                    <p class="font-semibold">${user.username}</p>
                                </div>
                                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-sm font-semibold">
                                    Logout
                                </button>
                            </div>
                        </div>
                    </nav>

                    <!-- Gamemode Tabs -->
                    <div class="bg-gray-800 border-b border-gray-700">
                        <div class="max-w-7xl mx-auto px-6 py-4">
                            <div class="flex gap-2 overflow-x-auto pb-2">
                                <button onclick="selectedGamemode='all'; render()" class="gamemode-tab ${selectedGamemode === 'all' ? 'active' : 'inactive'}">
                                    Overall
                                </button>
                                ${GAMEMODES.map(gm => `
                                    <button onclick="selectedGamemode='${gm}'; render()" class="gamemode-tab ${selectedGamemode === gm ? 'active' : 'inactive'}">
                                        ${GAMEMODE_EMOJIS[gm]} ${GAMEMODE_NAMES[gm]}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Main Content -->
                    <div class="max-w-7xl mx-auto px-6 py-8">
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <!-- Leaderboard -->
                            <div class="lg:col-span-2">
                                <div class="mb-6">
                                    <h2 class="text-3xl font-bold mb-6">🏆 Rankings</h2>
                                    
                                    ${filteredLeaderboard.length === 0 ? `
                                        <div class="bg-gray-800 rounded-lg border border-gray-700 px-6 py-12 text-center text-gray-400">
                                            📊 No rankings yet
                                        </div>
                                    ` : `
                                        <div class="space-y-3">
                                            ${filteredLeaderboard.map((player, idx) => {
                                                const position = idx + 1;
                                                const posClass = getPositionBadgeClass(position);
                                                const medal = getPositionMedal(position);
                                                
                                                return `
                                                    <div class="player-card cursor-pointer" onclick="selectPlayer('${player.user_id}', '${player.user_tag}')">
                                                        <div class="flex items-start gap-4">
                                                            <!-- Position Badge -->
                                                            <div class="position-badge ${posClass}">
                                                                ${position}
                                                            </div>
                                                            
                                                            <!-- Player Info -->
                                                            <div class="flex-1 min-w-0">
                                                                <div class="flex items-center gap-2 mb-2">
                                                                    <h3 class="text-lg font-bold">${player.user_tag}</h3>
                                                                    ${medal ? `<span class="text-2xl">${medal}</span>` : ''}
                                                                </div>
                                                                <p class="text-gray-400 text-sm mb-3">
                                                                    <span class="font-semibold text-purple-300">${player.total_points} points</span> • 
                                                                    <span>${player.tiers} tier${player.tiers === 1 ? '' : 's'}</span>
                                                                </p>
                                                                
                                                                <!-- Tier Badges -->
                                                                <div class="tier-icons">
                                                                    ${player.rank_breakdown ? Object.entries(player.rank_breakdown).map(([gamemode, rank]) => 
                                                                        `<div class="tier-icon ${RANK_COLORS[rank]}">${rank}</div>`
                                                                    ).join('') : ''}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>
                                    `}
                                </div>
                            </div>

                            <!-- Edit Panel -->
                            <div class="lg:col-span-1">
                                <div class="bg-gray-800 rounded-lg border border-purple-500 sticky top-24">
                                    <div class="bg-gradient-to-r from-blue-600 to-purple-600 px-6 py-4 rounded-t-lg">
                                        <h3 class="text-xl font-bold">✏️ Edit Ranks</h3>
                                    </div>
                                    
                                    <div class="p-6">
                                        ${selectedPlayer ? `
                                            <div>
                                                <p class="text-gray-400 text-xs mb-2">Selected Player</p>
                                                <p class="font-bold text-lg mb-6">${selectedPlayer.tag}</p>

                                                <div class="space-y-4">
                                                    ${GAMEMODES.map(gm => `
                                                        <div class="border border-gray-600 rounded p-3">
                                                            <p class="text-sm text-gray-400 mb-2">${GAMEMODE_EMOJIS[gm]} ${GAMEMODE_NAMES[gm]}</p>
                                                            <div class="flex gap-2 flex-wrap">
                                                                ${RANKS.map(r => `
                                                                    <button onclick="updateRank('${selectedPlayer.id}', '${gm}', '${r}')"
                                                                            class="px-3 py-1 rounded text-sm font-bold tier-badge ${RANK_COLORS[r]} hover:opacity-80 transition">
                                                                        ${r}
                                                                    </button>
                                                                `).join('')}
                                                                <button onclick="removeRank('${selectedPlayer.id}', '${gm}')"
                                                                        class="px-3 py-1 rounded text-sm font-bold tier-badge bg-red-600 hover:bg-red-700 transition">
                                                                    ✕
                                                                </button>
                                                            </div>
                                                        </div>
                                                    `).join('')}
                                                </div>
                                            </div>
                                        ` : `
                                            <p class="text-gray-400 text-center">👆 Click a player to edit</p>
                                        `}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectPlayer(userId, userTag) {
            selectedPlayer = { id: userId, tag: userTag };
            render();
        }

        // ════════════════════════════════════════════════════════════════════
        // 🚀 INIT
        // ════════════════════════════════════════════════════════════════════

        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
    <div id="app"></div>

    <script>

        // 📱 STATE & UTILS

        let user = null;
        let leaderboard = [];

        const GAMEMODE_NAMES = {
            'bedfight': 'Bedfight',
            'sumo': 'Sumo',
            'the_classic': 'The Classic',
            'the_bridge': 'The Bridge'
        };

        function getRankColor(rank) {
            const colors = { S: 'yellow', A: 'orange', B: 'blue', C: 'gray' };
            return colors[rank] || 'gray';
        }

        function getRankEmoji(rank) {
            const emojis = { S: '⭐', A: '🔥', B: '❄️', C: '🌊' };
            return emojis[rank] || '○';
        }

        // ════════════════════════════════════════════════════════════════════
        // 🔌 SOCKET.IO SETUP
        // ════════════════════════════════════════════════════════════════════

        function initSocket() {
            socket = io();
            
            socket.on('leaderboardUpdate', (data) => {
                leaderboard = data;
                render();
            });

            socket.on('rankUpdated', (data) => {

                fetchLeaderboard();
            });

            socket.on('rankRemoved', (data) => {
                console.log('✅ Rank removed:', data);
                fetchLeaderboard();
            });

        // ════════════════════════════════════════════════════════════════════
        // 🔐 AUTH
        // ════════════════════════════════════════════════════════════════════

            } catch (err) {
                console.error('Auth check failed:', err);
                showLoginPage();
            }
        }

        function logout() {
            window.location.href = '/auth/logout';
        }

        // ════════════════════════════════════════════════════════════════════
        // 📊 DATA FETCHING
        // ════════════════════════════════════════════════════════════════════

        async function fetchLeaderboard() {
            try {
                const res = await fetch('/api/leaderboard');
                if (res.ok) {
                    leaderboard = await res.json();
                    render();
                }
            } catch (err) {
                console.error('Failed to fetch leaderboard:', err);
            }
        }

        async function updateRank(userId, gamemode, rank) {
            try {
                const res = await fetch('/api/rank/set', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, gamemode, rank })
                });

                if (res.ok) {
                    alert('✅ Rank updated!');
                    fetchLeaderboard();
                } else {
                    alert('❌ Failed to update rank');
                }
            } catch (err) {
                console.error('Update failed:', err);
                alert('Error updating rank');
            }
        }

        async function removeRank(userId, gamemode) {
            if (!confirm(`Remove ${GAMEMODE_NAMES[gamemode]} tier from <@${userId}>?`)) return;

            try {
                const res = await fetch('/api/rank/remove', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, gamemode })
                });

                if (res.ok) {
                    alert('✅ Rank removed!');
                    fetchLeaderboard();
                } else {
                    alert('❌ Failed to remove rank');
                }
            } catch (err) {
                console.error('Removal failed:', err);
                alert('Error removing rank');
            }
        }

        // ════════════════════════════════════════════════════════════════════
        // 🎨 RENDER FUNCTIONS
        // ════════════════════════════════════════════════════════════════════

        function showLoginPage() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-purple-900 via-gray-900 to-black flex items-center justify-center">
                    <div class="text-center">
                        <h1 class="text-5xl font-bold mb-4">💎 fakepixel tier test Dashboard</h1>
                        <p class="text-gray-400 mb-8">Staff Portal with Real-time Rank Management</p>
                        <a href="/auth/login" class="bg-blue-600 hover:bg-blue-700 px-8 py-3 rounded-lg font-semibold inline-block">
                            🔐 Login with Discord
                        </a>
                    </div>
                </div>
            `;
        }

        function render() {
            if (!user) return showLoginPage();

            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900">
                    <!-- Header -->
                    <nav class="bg-gray-800 border-b border-purple-600 sticky top-0 z-50">
                        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <span class="text-3xl">💎</span>
                                <h1 class="text-2xl font-bold">fakepixel tier test Dashboard</h1>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="text-sm">
                                    <p class="text-gray-400">Logged in as</p>
                                    <p class="font-semibold">${user.username}</p>
                                </div>
                                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-sm font-semibold">
                                    Logout
                                </button>
                            </div>
                        </div>
                    </nav>

                    <!-- Main Content -->
                    <div class="max-w-7xl mx-auto px-6 py-8">
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <!-- Leaderboard -->
                            <div class="lg:col-span-2">
                                <div class="bg-gray-800 rounded-lg border border-purple-500 overflow-hidden">
                                    <div class="bg-gradient-to-r from-purple-600 to-blue-600 px-6 py-4">
                                        <h2 class="text-2xl font-bold">🏆 Top 10 Leaderboard</h2>
                                        <p class="text-gray-200 text-sm">Live rankings by points</p>
                                    </div>

                                        ${leaderboard.length === 0 ? `
                                            <div class="px-6 py-8 text-center text-gray-400">
                                                📊 No rankings yet
                                            </div>
                                        ` : leaderboard.map((player, idx) => `

                                                <div class="flex items-center justify-between">
                                                    <div class="flex items-center gap-4">
                                                        <span class="text-2xl font-bold text-purple-400 w-8">${idx + 1}</span>

                                                            <p class="font-semibold">${player.user_tag}</p>
                                                            <p class="text-gray-400 text-sm">${player.tiers} tier${player.tiers === 1 ? '' : 's'} • ${player.total_points} pts</p>
                                                        </div>
                                                    </div>
                                                    <div class="text-2xl">
                                                        ${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : ''}
                                                    </div>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>

                                    </div>
                                    
                                    <div class="p-6">
                                        ${selectedPlayer ? `
                                            <div>
                                                <p class="text-gray-400 text-xs mb-2">Selected Player</p>
                                                <p class="font-bold text-lg mb-6">${selectedPlayer.tag}</p>

                                                <div class="space-y-4">
                                                    ${GAMEMODES.map(gm => `
                                                        <div class="border border-gray-600 rounded p-3">
                                                            <p class="text-sm text-gray-400 mb-2">${GAMEMODE_NAMES[gm]}</p>
                                                            <div class="flex gap-2 flex-wrap">
                                                                ${RANKS.map(r => `
                                                                    <button onclick="updateRank('${selectedPlayer.id}', '${gm}', '${r}')"
                                                                            class="px-3 py-1 rounded text-sm font-bold rank-${r.toLowerCase()} hover:opacity-80 transition">
                                                                        ${r}
                                                                    </button>
                                                                `).join('')}
                                                                <button onclick="removeRank('${selectedPlayer.id}', '${gm}')"
                                                                        class="px-3 py-1 rounded text-sm font-bold bg-red-600 hover:bg-red-700 transition">
                                                                    ✕
                                                                </button>
                                                            </div>
                                                        </div>
                                                    `).join('')}
                                                </div>
                                            </div>
                                        ` : `
                                            <p class="text-gray-400 text-center">👆 Click a player to edit</p>
                                        `}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectPlayer(userId, userTag) {
            selectedPlayer = { id: userId, tag: userTag };
            render();
        }

        // ════════════════════════════════════════════════════════════════════

        // ════════════════════════════════════════════════════════════════════

        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
